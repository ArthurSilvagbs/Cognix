<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifique seu email — Cognix v2 · protótipo</title>
<script>document.documentElement.dataset.theme = localStorage.getItem('cognix-tema') || 'dark';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/wireframe.css">
<style>
  body { font-family:Inter,-apple-system,"Segoe UI",sans-serif; }
  .scene { position:fixed; inset:0; overflow:hidden; background:var(--bg-app); }

  .vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(78% 56% at 50% 28%, var(--primary-soft), transparent 62%); opacity:.8; }

  .grid-lines { position:absolute; inset:0; pointer-events:none; opacity:.8; }
  .hline, .vline { position:absolute; background:var(--line-strong); will-change:transform,opacity; }
  .hline { left:0; right:0; height:1px; transform:scaleX(0); transform-origin:50% 50%;
    animation:drawX .8s cubic-bezier(.22,.61,.36,1) forwards; }
  .vline { top:0; bottom:0; width:1px; transform:scaleY(0); transform-origin:50% 0%;
    animation:drawY .9s cubic-bezier(.22,.61,.36,1) forwards; }
  .hline:nth-child(1){ top:18%; animation-delay:.12s } .hline:nth-child(2){ top:50%; animation-delay:.22s }
  .hline:nth-child(3){ top:82%; animation-delay:.32s }
  .vline:nth-child(4){ left:22%; animation-delay:.42s } .vline:nth-child(5){ left:50%; animation-delay:.54s }
  .vline:nth-child(6){ left:78%; animation-delay:.66s }
  .hline::after, .vline::after { content:""; position:absolute; inset:0; opacity:0;
    background:linear-gradient(90deg, transparent, var(--primary-strong), transparent);
    animation:shimmer 1s ease-out forwards; }
  .vline::after { background:linear-gradient(180deg, transparent, var(--primary-strong), transparent); }
  .hline:nth-child(1)::after{ animation-delay:.12s } .hline:nth-child(2)::after{ animation-delay:.22s }
  .hline:nth-child(3)::after{ animation-delay:.32s } .vline:nth-child(4)::after{ animation-delay:.42s }
  .vline:nth-child(5)::after{ animation-delay:.54s } .vline:nth-child(6)::after{ animation-delay:.66s }
  @keyframes drawX { 0%{ transform:scaleX(0); opacity:0 } 60%{ opacity:.95 } 100%{ transform:scaleX(1); opacity:.7 } }
  @keyframes drawY { 0%{ transform:scaleY(0); opacity:0 } 60%{ opacity:.95 } 100%{ transform:scaleY(1); opacity:.7 } }
  @keyframes shimmer { 0%{ opacity:0 } 35%{ opacity:.5 } 100%{ opacity:0 } }

  canvas#dust { position:absolute; inset:0; width:100%; height:100%; opacity:.5; mix-blend-mode:screen; pointer-events:none; }

  .topbar { position:absolute; left:0; right:0; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between;
    padding:var(--s4) var(--s5); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:var(--s2); font-weight:800; letter-spacing:.02em; font-size:var(--t-md); }
  .brand .mark { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:14px; background:linear-gradient(145deg, var(--primary-strong), var(--primary));
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.25); }
  .brand .v { font-size:var(--t-kicker); font-weight:700; color:var(--primary-strong); }

  .center { position:relative; z-index:1; height:100%; display:grid; place-items:center; padding:var(--s5); }
  .login-card { width:100%; max-width:400px; border-radius:var(--radius); text-align:center;
    border:1px solid var(--line-strong);
    background:color-mix(in srgb, var(--bg-card) 72%, transparent); backdrop-filter:blur(14px);
    box-shadow:var(--shadow-md); padding:var(--s6);
    opacity:0; transform:translateY(20px); animation:fadeUp .8s cubic-bezier(.22,.61,.36,1) .4s forwards; }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

  .mail-badge { width:72px; height:72px; border-radius:20px; margin:0 auto var(--s5); display:flex; align-items:center; justify-content:center;
    color:var(--primary-strong); background:var(--primary-soft); border:1px solid var(--primary-line); position:relative; }
  .mail-badge svg { width:34px; height:34px; }
  .mail-badge::after { content:""; position:absolute; inset:-6px; border-radius:24px; border:1px solid var(--primary-line);
    opacity:0; animation:ping 2.6s ease-out infinite; }
  @keyframes ping { 0%{ opacity:.5; transform:scale(1); } 100%{ opacity:0; transform:scale(1.18); } }

  .login-card h1 { font-size:var(--t-h1); font-weight:700; letter-spacing:-.02em; }
  .login-card .sub { color:var(--ink-500); font-size:var(--t-body); margin-top:var(--s2); line-height:1.55; }
  .login-card .sub b { color:var(--ink-900); font-weight:600; }

  .code { display:flex; gap:var(--s2); justify-content:center; margin:var(--s5) 0 var(--s4); }
  .code input { width:46px; height:56px; text-align:center; font:inherit; font-size:24px; font-weight:700;
    font-variant-numeric:tabular-nums; border-radius:var(--radius-sm);
    border:1px solid var(--line-strong); background:var(--bg-app); color:var(--ink-900);
    transition:border-color var(--speed), box-shadow var(--speed); }
  .code input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .btn.block { width:100%; justify-content:center; padding:11px; font-size:var(--t-md); }
  .btn.primary.block { transition:transform var(--speed), background var(--speed), border-color var(--speed); }
  .btn.primary.block:hover:not(:disabled) { transform:translateY(-1px); }
  .btn.primary.block:disabled { opacity:.5; cursor:not-allowed; }

  .resend { font-size:var(--t-meta); color:var(--ink-500); margin-top:var(--s2); }
  .resend button { font:inherit; font-weight:600; color:var(--primary-strong); background:none; border:none; cursor:pointer; padding:0; }
  .resend button:hover:not(:disabled) { text-decoration:underline; }
  .resend button:disabled { color:var(--ink-400); cursor:not-allowed; }

  .spam { font-size:var(--t-caption); color:var(--ink-400); margin-top:var(--s4);
    border-top:1px solid var(--line); padding-top:var(--s4); line-height:1.5; }
  .spam a { color:var(--ink-700); }

  .toast { position:fixed; left:50%; bottom:var(--s6); transform:translateX(-50%) translateY(10px);
    background:var(--toast-bg); color:var(--toast-fg); font-size:var(--t-meta); font-weight:500;
    padding:var(--s3) var(--s4); border-radius:var(--radius); box-shadow:var(--shadow-md);
    opacity:0; pointer-events:none; transition:opacity var(--speed), transform var(--speed); z-index:60; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .demo-bar { position:fixed; left:var(--s4); bottom:var(--s4); z-index:50; display:flex; align-items:center; gap:var(--s2);
    padding:var(--s2) var(--s3); border-radius:99px; background:var(--bg-card); border:1px solid var(--line-strong);
    box-shadow:var(--shadow-md); font-size:var(--t-caption); }
  .demo-bar button { font:inherit; cursor:pointer; border:none; background:transparent; color:var(--ink-500);
    padding:4px var(--s2); border-radius:99px; }
  .demo-bar button:hover { background:var(--bg-soft); color:var(--ink-900); }

  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; }
    .login-card{ opacity:1; transform:none; } .hline{ transform:scaleX(1); } .vline{ transform:scaleY(1); } }
</style>
</head>
<body>

<div class="scene">
  <div class="vignette"></div>
  <div class="grid-lines" aria-hidden="true">
    <div class="hline"></div><div class="hline"></div><div class="hline"></div>
    <div class="vline"></div><div class="vline"></div><div class="vline"></div>
  </div>
  <canvas id="dust" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand"><span class="mark">C</span> Cognix <span class="v">v2</span></div>
    <a class="btn ghost sm" href="#">Precisa de ajuda?</a>
  </header>

  <div class="center">
    <div class="login-card">
      <div class="mail-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </div>

      <h1>Verifique seu email</h1>
      <div class="sub">Digite o código de 6 dígitos que enviamos para<br><b id="email">voce@email.com</b>.</div>

      <form class="code" id="code" autocomplete="one-time-code" onsubmit="return false">
        <input inputmode="numeric" maxlength="1" aria-label="dígito 1">
        <input inputmode="numeric" maxlength="1" aria-label="dígito 2">
        <input inputmode="numeric" maxlength="1" aria-label="dígito 3">
        <input inputmode="numeric" maxlength="1" aria-label="dígito 4">
        <input inputmode="numeric" maxlength="1" aria-label="dígito 5">
        <input inputmode="numeric" maxlength="1" aria-label="dígito 6">
      </form>

      <button class="btn primary block" id="btnVerificar" disabled>Verificar</button>

      <div class="resend">Não recebeu? <button id="btnResend">Reenviar código</button></div>

      <div class="spam">
        Pode levar um minuto — e às vezes cai no <b>spam</b>.<br>
        Email errado? <a href="cadastro.html">Voltar e corrigir</a>.
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Email reenviado para voce@email.com</div>
<nav class="demo-bar" aria-label="Tema"><button id="btnTema">alternar claro/escuro</button></nav>

<script>
  document.getElementById('btnTema').onclick = () => {
    const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t; localStorage.setItem('cognix-tema', t);
  };

  // se vier ?email= na URL, mostra o email real (no app, vem do cadastro)
  const params = new URLSearchParams(location.search);
  if (params.get('email')) document.getElementById('email').textContent = params.get('email');

  const toast = document.getElementById('toast');
  const showToast = (msg) => { toast.textContent = msg; toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000); };
  const emailTxt = () => document.getElementById('email').textContent;

  // campos do código: auto-avanço, backspace volta, colar preenche tudo
  const inputs = [...document.querySelectorAll('#code input')];
  const verificar = document.getElementById('btnVerificar');
  const sync = () => { verificar.disabled = inputs.some(i => !i.value); };
  inputs.forEach((inp, i) => {
    inp.oninput = () => {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
      if (inp.value && i < 5) inputs[i + 1].focus();
      sync();
    };
    inp.onkeydown = (e) => { if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus(); };
    inp.onpaste = (e) => {
      e.preventDefault();
      const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
      d.split('').forEach((ch, k) => { if (inputs[k]) inputs[k].value = ch; });
      (inputs[Math.min(d.length, 5)]).focus(); sync();
    };
  });
  verificar.onclick = () => {  // no app: supabase.auth.verifyOtp({ email, token, type:'signup' })
    verificar.disabled = true; verificar.textContent = 'Verificando…';
    setTimeout(() => showToast('Conta verificada! Redirecionando…'), 600);
  };

  // reenviar com cooldown (demonstra estado disabled + feedback)
  const btn = document.getElementById('btnResend');
  let timer = null;
  btn.onclick = () => {
    showToast('Código reenviado para ' + emailTxt());
    let s = 30; btn.disabled = true; btn.textContent = `Reenviar em ${s}s`;
    timer = setInterval(() => {
      s--; btn.textContent = `Reenviar em ${s}s`;
      if (s <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = 'Reenviar código'; }
    }, 1000);
  };

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('dust'), ctx = canvas.getContext('2d');
  let ps = [], raf = 0;
  const setSize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
  const make = () => ({ x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    v:Math.random()*0.25+0.05, o:Math.random()*0.35+0.15 });
  const init = () => { ps = []; const n = Math.floor((canvas.width*canvas.height)/9000); for (let i=0;i<n;i++) ps.push(make()); };
  const draw = () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ps.forEach(p => {
      p.y -= p.v;
      if (p.y < 0) { p.x = Math.random()*canvas.width; p.y = canvas.height + Math.random()*40;
        p.v = Math.random()*0.25+0.05; p.o = Math.random()*0.35+0.15; }
      ctx.fillStyle = `rgba(244,244,245,${p.o})`;
      ctx.fillRect(p.x, p.y, 0.8, 2.4);
    });
    raf = requestAnimationFrame(draw);
  };
  setSize(); init();
  if (!reduce) raf = requestAnimationFrame(draw);
  addEventListener('resize', () => { setSize(); init(); });
</script>
</body>
</html>
